<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Geliştirici Profili</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      max-width: 320px;
    }
    h1 { margin: 10px 0 5px; font-size: 22px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    .link-btn {
      display: block;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Muhammet Bozbaş</h1>
    <p>Yazılım Mühendisliği Öğrencisi</p>
    <a href="https://github.com" class="link-btn" target="_blank">GitHub Profilim</a>
    <a href="https://linkedin.com" class="link-btn" target="_blank">LinkedIn</a>
  </div>
</body>
</html>
